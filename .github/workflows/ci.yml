name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/ examples/ scripts/hatch_build.py

      - name: Check formatting with ruff
        run: uv run ruff format --check src/ tests/ examples/ scripts/hatch_build.py

      - name: Type check with mypy
        run: uv run mypy src/mdsp scripts/hatch_build.py

      - name: Install PortAudio
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install portaudio;
          else sudo apt-get update && sudo apt-get install -y libportaudio2; fi

      - name: Build Mojo extension
        run: make build

      - name: Run tests
        run: uv run pytest -v --cov=src/mdsp --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  wheels:
    name: Wheels
    needs: qa
    uses: ./.github/workflows/wheels.yml
