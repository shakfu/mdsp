name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/ hatch_build.py

      - name: Check formatting with ruff
        run: uv run ruff format --check src/ tests/ hatch_build.py

      - name: Type check with mypy
        run: uv run mypy src/mdsp hatch_build.py

      - name: Build Mojo extension
        run: make build

      - name: Run tests
        run: uv run pytest -v --cov=src/mdsp --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  wheels:
    name: Wheels
    needs: qa
    uses: ./.github/workflows/wheels.yml
