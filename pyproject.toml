[project]
name = "mdsp"
version = "0.1.0"
description = "Python audio DSP library with kernels written in Mojo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["audio", "dsp", "signal-processing", "mojo", "synthesis", "filters"]
dependencies = [
    "numpy>=2.2.6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "auditwheel>=6.4; sys_platform == 'linux'",
    "delocate>=0.13; sys_platform == 'darwin'",
    "hatchling>=1.32.3",
    "mojo>=1.1.0,<1.2",
    "patchelf>=0.17; sys_platform == 'linux'",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "twine>=7.0.0",
]

[build-system]
requires = [
    "hatchling>=1.32.3",
    "mojo-compiler>=1.1.0,<1.2",
    "patchelf>=0.17; sys_platform == 'linux'",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdsp"]
# Mojo sources are compiled by the hook; the in-tree dev build is gitignored.
exclude = ["src/mdsp/_mojo"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.claude", "/.github", "/thirdparty", "skills-lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/mdsp"]
addopts = "--doctest-modules"
pythonpath = ["scripts"]

[tool.ruff]
src = ["src", "tests", "scripts"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["mojo.*"]
ignore_missing_imports = true
